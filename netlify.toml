# Netlify publishes the ready-built page in docs/ (GitHub Pages serves the same folder).
# There is no build step: docs/index.html is rebuilt from src/ (python3 src/build.py) before each commit.
[build]
  publish = "docs"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
